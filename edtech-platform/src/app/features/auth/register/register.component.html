<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 text-right">
  <div class="max-w-md w-full space-y-8 bg-surface-container-lowest p-8 rounded-2xl border border-outline-variant shadow-md">
    <div>
      <img src="/favicon.ico" alt="matar.dev" class="w-14 h-14 rounded-2xl object-contain mx-auto mb-4 shadow-sm" />
      <h2 class="text-center text-2xl font-headline-lg font-extrabold text-on-surface">
        إنشاء حساب جديد
      </h2>
      <p class="mt-2 text-center text-sm font-body-md text-on-surface-variant">
        انضم إلى مجتمع matar.dev وابدأ رحلة البرمجة والتعلم اليوم
      </p>
    </div>

    @if (errorMessage) {
      <div class="bg-error-container text-on-error-container p-4 rounded-xl text-sm font-label-md flex items-center gap-2">
        <span class="material-symbols-outlined text-xl">error</span>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="firstName" class="block text-sm font-label-md text-on-surface mb-1">الاسم الأول</label>
          <input
            id="firstName"
            type="text"
            formControlName="firstName"
            class="w-full px-4 py-2.5 rounded-xl border border-outline bg-surface text-on-surface focus:ring-2 focus:ring-primary/40 transition-all"
          />
        </div>
        <div>
          <label for="lastName" class="block text-sm font-label-md text-on-surface mb-1">اسم العائلة</label>
          <input
            id="lastName"
            type="text"
            formControlName="lastName"
            class="w-full px-4 py-2.5 rounded-xl border border-outline bg-surface text-on-surface focus:ring-2 focus:ring-primary/40 transition-all"
          />
        </div>
      </div>

      <div>
        <label for="username" class="block text-sm font-label-md text-on-surface mb-1">اسم المستخدم</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="ahmed_2026"
          class="w-full px-4 py-2.5 rounded-xl border border-outline bg-surface text-on-surface focus:ring-2 focus:ring-primary/40 transition-all text-left"
        />
      </div>

      <div>
        <label for="email" class="block text-sm font-label-md text-on-surface mb-1">البريد الإلكتروني</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="example@domain.com"
          class="w-full px-4 py-2.5 rounded-xl border border-outline bg-surface text-on-surface focus:ring-2 focus:ring-primary/40 transition-all text-left"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-label-md text-on-surface mb-1">كلمة المرور</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full px-4 py-2.5 rounded-xl border border-outline bg-surface text-on-surface focus:ring-2 focus:ring-primary/40 transition-all text-left"
        />
      </div>

      <div class="pt-2">
        <app-button
          type="submit"
          variant="primary"
          [loading]="loading"
          [disabled]="form.invalid"
          class="w-full"
        >
          إنشاء الحساب
        </app-button>
      </div>
    </form>

    <div class="text-center text-sm font-body-md text-on-surface-variant border-t border-outline-variant pt-4">
      لديك حساب بالفعل؟
      <a routerLink="/auth/login" class="font-label-md text-primary font-semibold hover:underline">تسجيل الدخول</a>
    </div>
  </div>
</div>
