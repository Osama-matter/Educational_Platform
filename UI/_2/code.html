<html dir="rtl" lang="ar"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;overflow-x:hidden;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"outline":"#6d7a77","surface-variant":"#d3e4fe","surface-bright":"#f8f9ff","primary-fixed":"#89f5e7","surface-container-low":"#eff4ff","on-background":"#0b1c30","surface-container":"#e5eeff","secondary":"#855300","secondary-fixed-dim":"#ffb95f","on-primary-fixed":"#00201d","inverse-surface":"#213145","on-primary":"#ffffff","secondary-fixed":"#ffddb8","on-surface":"#0b1c30","tertiary":"#3e57a8","on-surface-variant":"#3d4947","surface":"#f8f9ff","inverse-primary":"#6bd8cb","background":"#f8f9ff","surface-dim":"#cbdbf5","tertiary-fixed":"#dce1ff","tertiary-fixed-dim":"#b6c4ff","tertiary-container":"#5870c3","surface-tint":"#006a61","on-tertiary-fixed":"#00164e","on-tertiary-fixed-variant":"#264191","on-secondary-fixed":"#2a1700","surface-container-lowest":"#ffffff","on-secondary-container":"#684000","on-primary-container":"#f4fffc","secondary-container":"#fea619","on-tertiary-container":"#fffbff","primary-container":"#008378","primary-fixed-dim":"#6bd8cb","on-secondary-fixed-variant":"#653e00","on-error-container":"#93000a","outline-variant":"#bcc9c6","error":"#ba1a1a","on-primary-fixed-variant":"#005049","surface-container-high":"#dce9ff","on-secondary":"#ffffff","surface-container-highest":"#d3e4fe","on-tertiary":"#ffffff","error-container":"#ffdad6","primary":"#00685f","on-error":"#ffffff","inverse-on-surface":"#eaf1ff"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"container-max":"1280px","unit":"4px","gutter":"24px","section-gap":"64px","margin-desktop":"32px","margin-mobile":"16px"},"fontFamily":{"label-md":["IBM Plex Sans Arabic"],"caption":["IBM Plex Sans Arabic"],"headline-lg-mobile":["IBM Plex Sans Arabic"],"body-md":["IBM Plex Sans Arabic"],"headline-lg":["IBM Plex Sans Arabic"],"body-lg":["IBM Plex Sans Arabic"],"headline-md":["IBM Plex Sans Arabic"],"display-lg":["IBM Plex Sans Arabic"]},"fontSize":{"label-md":["14px",{"lineHeight":"20px","fontWeight":"500"}],"caption":["12px",{"lineHeight":"18px","fontWeight":"400"}],"headline-lg-mobile":["24px",{"lineHeight":"36px","fontWeight":"600"}],"body-md":["16px",{"lineHeight":"28px","fontWeight":"400"}],"headline-lg":["32px",{"lineHeight":"48px","fontWeight":"600"}],"body-lg":["18px",{"lineHeight":"32px","fontWeight":"400"}],"headline-md":["24px",{"lineHeight":"36px","fontWeight":"600"}],"display-lg":["48px",{"lineHeight":"64px","fontWeight":"700"}]}}}}</script></head><body class="bg-background font-body-md text-on-surface"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-4 flex items-center gap-3"><button class="w-11 h-11 flex items-center justify-center text-on-surface hover:bg-surface-variant rounded-full" onclick="history.back()"><span class="material-symbols-outlined">arrow_forward</span></button><h1 class="text-headline-md font-headline-md text-on-surface truncate">Quiz</h1></div></header><main class="flex flex-col relative w-full pt-16 min-h-screen bg-background"><div class="flex flex-col w-full h-full relative" id="quiz-container">
<!-- Progress Section -->
<div class="px-gutter pt-8 pb-4 flex flex-col gap-3 shrink-0">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-outline">السؤال ٥ من ١٠</span>
<span class="font-label-md text-label-md text-primary-fixed-dim">٥٠٪ مكتمل</span>
</div>
<!-- Progress Bar (Mirrored for RTL: Fills Right to Left) -->
<div class="h-2 w-full bg-surface-variant rounded-full overflow-hidden flex justify-end">
<div class="h-full bg-gradient-to-l from-primary to-primary-fixed-dim rounded-full transition-all duration-500 ease-out" style="width: 50%;"></div>
</div>
</div>
<!-- Question Section -->
<div class="px-gutter py-section-gap flex-grow flex flex-col gap-8">
<div class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_4px_24px_rgba(30,58,138,0.04)] relative overflow-hidden">
<!-- Decorative element -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary/5 rounded-full blur-2xl"></div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface leading-tight relative z-10">
        ما هي أهمية تصميم واجهة المستخدم باللغة العربية مع مراعاة اتجاه القراءة من اليمين إلى اليسار (RTL)؟
      </h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-3 relative z-10">
        اختر الإجابة الأكثر دقة وشمولاً من الخيارات التالية.
      </p>
</div>
<!-- Options List -->
<div class="flex flex-col gap-3" id="options-group">
<!-- Option 1 -->
<button class="quiz-option text-right w-full bg-surface-container-lowest p-5 rounded-lg flex items-start gap-4 transition-all duration-200 shadow-[0_2px_8px_rgba(30,58,138,0.02)] hover:shadow-[0_4px_12px_rgba(30,58,138,0.06)] hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-primary/50 relative overflow-hidden" data-selected="false">
<div class="w-6 h-6 rounded-full border-2 border-outline flex-shrink-0 mt-0.5 flex items-center justify-center transition-colors duration-200 option-radio">
<div class="w-3 h-3 bg-primary rounded-full scale-0 transition-transform duration-200 option-radio-inner"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">مجرد متطلب تقني لضمان عمل التطبيق على الأجهزة القديمة ولا يؤثر على تجربة المستخدم.</span>
<div class="absolute inset-0 bg-primary/5 opacity-0 transition-opacity duration-200 option-bg"></div>
</button>
<!-- Option 2 (Correct Answer for context, but initially unselected) -->
<button class="quiz-option text-right w-full bg-surface-container-lowest p-5 rounded-lg flex items-start gap-4 transition-all duration-200 shadow-[0_2px_8px_rgba(30,58,138,0.02)] hover:shadow-[0_4px_12px_rgba(30,58,138,0.06)] hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-primary/50 relative overflow-hidden" data-selected="false">
<div class="w-6 h-6 rounded-full border-2 border-outline flex-shrink-0 mt-0.5 flex items-center justify-center transition-colors duration-200 option-radio">
<div class="w-3 h-3 bg-primary rounded-full scale-0 transition-transform duration-200 option-radio-inner"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">يحسن تجربة المستخدم من خلال مواءمة تدفق المعلومات مع النمط الذهني الطبيعي للمستخدم العربي، مما يقلل العبء المعرفي.</span>
<div class="absolute inset-0 bg-primary/5 opacity-0 transition-opacity duration-200 option-bg"></div>
</button>
<!-- Option 3 -->
<button class="quiz-option text-right w-full bg-surface-container-lowest p-5 rounded-lg flex items-start gap-4 transition-all duration-200 shadow-[0_2px_8px_rgba(30,58,138,0.02)] hover:shadow-[0_4px_12px_rgba(30,58,138,0.06)] hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-primary/50 relative overflow-hidden" data-selected="false">
<div class="w-6 h-6 rounded-full border-2 border-outline flex-shrink-0 mt-0.5 flex items-center justify-center transition-colors duration-200 option-radio">
<div class="w-3 h-3 bg-primary rounded-full scale-0 transition-transform duration-200 option-radio-inner"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">يقتصر فقط على ترجمة النصوص دون الحاجة لتغيير تخطيط الشاشة أو اتجاه الأيقونات والأسهم.</span>
<div class="absolute inset-0 bg-primary/5 opacity-0 transition-opacity duration-200 option-bg"></div>
</button>
<!-- Option 4 -->
<button class="quiz-option text-right w-full bg-surface-container-lowest p-5 rounded-lg flex items-start gap-4 transition-all duration-200 shadow-[0_2px_8px_rgba(30,58,138,0.02)] hover:shadow-[0_4px_12px_rgba(30,58,138,0.06)] hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-primary/50 relative overflow-hidden" data-selected="false">
<div class="w-6 h-6 rounded-full border-2 border-outline flex-shrink-0 mt-0.5 flex items-center justify-center transition-colors duration-200 option-radio">
<div class="w-3 h-3 bg-primary rounded-full scale-0 transition-transform duration-200 option-radio-inner"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">هو خيار تجميلي بحت يطلبه العملاء أحياناً ولا توجد دراسات تثبت تأثيره على كفاءة استخدام التطبيق.</span>
<div class="absolute inset-0 bg-primary/5 opacity-0 transition-opacity duration-200 option-bg"></div>
</button>
</div>
</div>
<!-- Bottom Action Area -->
<div class="p-4 bg-surface-container-lowest/80 backdrop-blur-md pb-safe mt-auto shadow-[0_-4px_24px_rgba(30,58,138,0.04)] z-20">
<div class="flex items-center justify-between gap-4">
<button class="h-11 px-6 rounded-lg text-outline hover:bg-surface-variant/50 transition-colors font-label-md text-label-md flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">bookmark</span>
        حفظ لوقت لاحق
      </button>
<button class="h-11 px-8 rounded-lg bg-primary text-on-primary font-label-md text-label-md flex items-center gap-2 shadow-sm hover:shadow-md transition-all opacity-50 cursor-not-allowed pointer-events-none" disabled="" id="next-btn">
        التالي
        <span class="material-symbols-outlined text-[20px] rotate-180">arrow_forward</span>
</button>
</div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const options = document.querySelectorAll('.quiz-option');
    const nextBtn = document.getElementById('next-btn');

    options.forEach(option => {
      option.addEventListener('click', () => {
        // Reset all options
        options.forEach(opt => {
          opt.setAttribute('data-selected', 'false');
          
          // Reset visual states
          const radio = opt.querySelector('.option-radio');
          const inner = opt.querySelector('.option-radio-inner');
          const bg = opt.querySelector('.option-bg');
          
          radio.classList.remove('border-primary');
          radio.classList.add('border-outline');
          inner.classList.remove('scale-100');
          inner.classList.add('scale-0');
          bg.classList.remove('opacity-100');
          bg.classList.add('opacity-0');
          
          opt.classList.remove('ring-2', 'ring-primary/20', 'border-primary');
        });

        // Set selected option
        option.setAttribute('data-selected', 'true');
        
        // Update visual state for selected
        const radio = option.querySelector('.option-radio');
        const inner = option.querySelector('.option-radio-inner');
        const bg = option.querySelector('.option-bg');
        
        radio.classList.remove('border-outline');
        radio.classList.add('border-primary');
        inner.classList.remove('scale-0');
        inner.classList.add('scale-100');
        bg.classList.remove('opacity-0');
        bg.classList.add('opacity-100');
        
        option.classList.add('ring-2', 'ring-primary/20', 'border-primary');

        // Enable Next Button
        nextBtn.disabled = false;
        nextBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
        nextBtn.classList.add('hover:-translate-y-0.5');
        
        // Add subtle pop animation to the selected card
        option.style.transform = 'scale(0.98)';
        setTimeout(() => {
          option.style.transform = 'scale(1) translateY(-2px)';
        }, 50);
      });
    });
  });
</script></main></body></html>
