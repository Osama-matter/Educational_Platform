<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-primary text-center">مرحباً بعودتك</h1>
<p class="text-body-md font-body-md text-on-surface-variant text-center">قم بتسجيل الدخول للمتابعة إلى بوابة الطالب</p>
</div>
<form class="flex flex-col gap-5 w-full" id="loginForm">
<div class="flex flex-col gap-2 relative group">
<label class="text-label-md font-label-md text-on-surface text-right" for="email">البريد الإلكتروني</label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface text-on-surface px-4 pl-12 rounded-lg border border-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-left" dir="ltr" id="email" placeholder="name@university.edu" required="" type="email"/>
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant group-focus-within:text-primary transition-colors">mail</span>
</div>
</div>
<div class="flex flex-col gap-2 relative group">
<div class="flex justify-between items-center w-full">
<a class="text-caption font-caption text-secondary hover:text-secondary-container transition-colors" href="#">نسيت كلمة المرور؟</a>
<label class="text-label-md font-label-md text-on-surface text-right" for="password">كلمة المرور</label>
</div>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface text-on-surface px-4 pl-12 rounded-lg border border-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-left" dir="ltr" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute left-4 w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="toggleIcon">visibility_off</span>
</button>
</div>
</div>
<button class="w-full h-12 bg-secondary text-on-secondary rounded-lg text-label-md font-label-md font-bold mt-2 hover:bg-secondary-container transition-all active:scale-[0.98] shadow-sm relative overflow-hidden group" type="submit">
<span class="relative z-10 flex items-center justify-center gap-2">
                    تسجيل الدخول
                    <span class="material-symbols-outlined text-[18px]">arrow_back</span>
</span>
<div class="absolute inset-0 bg-white/20 translate-x-full group-hover:translate-x-0 transition-transform duration-300 ease-out"></div>
</button>
</form>
<div class="flex justify-center items-center mt-2 gap-1">
<span class="text-body-md font-body-md text-on-surface-variant">طالب جديد؟</span>
<a class="text-body-md font-body-md text-primary font-bold hover:text-primary-container transition-colors" href="#">إنشاء حساب</a>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');
        
        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
        });

        const form = document.getElementById('loginForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>`;
            btn.disabled = true;
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-80');
                // Simulate success
                btn.classList.remove('bg-secondary');
                btn.classList.add('bg-primary');
                btn.innerHTML = `<span class="flex items-center justify-center gap-2"><span class="material-symbols-outlined">check</span> تم الدخول</span>`;
                setTimeout(() => {
                    btn.classList.remove('bg-primary');
                    btn.classList.add('bg-secondary');
                    btn.innerHTML = originalText;
                }, 1500);
            }, 1500);
        });
    });
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-bold"><div class="flex justify-around items-center h-16 px-2"><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] text-on-surface-variant transition-all" data-path="home" href="#"><span class="material-symbols-outlined">home</span><span class="text-caption font-caption">الرئيسية</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-1 min-w-[64px] transition-all text-primary font-bold" data-path="catalog" href="#"><span class="material-symbols-outlined">grid_view</span><span class="text-caption font-caption">الدليل</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] text-on-surface-variant transition-all" data-path="my-courses" href="#"><span class="material-symbols-outlined">menu_book</span><span class="text-caption font-caption">دوراتي</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] text-on-surface-variant transition-all" data-path="forum" href="#"><span class="material-symbols-outlined">forum</span><span class="text-caption font-caption">المنتدى</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[64px] text-on-surface-variant transition-all" data-path="settings" href="#"><span class="material-symbols-outlined">settings</span><span class="text-caption font-caption">الإعدادات</span></a></div></nav></body></html>
